apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "campus-resource-hub.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "campus-resource-hub.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: "INFO"
  POSTGRES_HOST: "{{ include "campus-resource-hub.fullname" . }}-postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: {{ .Values.postgresql.database | quote }}
  CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://campus-hub.local"
