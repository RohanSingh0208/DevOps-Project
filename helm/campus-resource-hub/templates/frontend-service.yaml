apiVersion: v1
kind: Service
metadata:
  name: {{ include "campus-resource-hub.fullname" . }}-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "campus-resource-hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  ports:
    - port: {{ .Values.frontend.service.port }}
      targetPort: {{ .Values.frontend.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "campus-resource-hub.name" . }}-frontend
    app.kubernetes.io/instance: {{ .Release.Name }}
