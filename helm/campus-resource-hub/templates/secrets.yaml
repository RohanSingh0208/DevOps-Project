apiVersion: v1
kind: Secret
metadata:
  name: {{ include "campus-resource-hub.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "campus-resource-hub.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgresql.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  DATABASE_URL: "postgresql+asyncpg://{{ .Values.postgresql.username }}:{{ .Values.postgresql.password }}@{{ include "campus-resource-hub.fullname" . }}-postgres:5432/{{ .Values.postgresql.database }}"
  DATABASE_URL_SYNC: "postgresql+psycopg2://{{ .Values.postgresql.username }}:{{ .Values.postgresql.password }}@{{ include "campus-resource-hub.fullname" . }}-postgres:5432/{{ .Values.postgresql.database }}"
