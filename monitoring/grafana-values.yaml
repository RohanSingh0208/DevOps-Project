# Grafana Standalone / Additional Values Configuration
adminUser: "admin"
adminPassword: "admin_campus_metrics_2026"

service:
  type: ClusterIP
  port: 80
  targetPort: 3000

ingress:
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://monitoring-kube-prometheus-prometheus.monitoring:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: "campus-resource-hub"
        orgId: 1
        folder: "Campus Hub Monitoring"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards
