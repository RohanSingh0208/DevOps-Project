apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-target-app
  namespace: default
  labels:
    app: correct-target-app
    lab.devsecops.io/scenario: broken-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: correct-target-app
  template:
    metadata:
      labels:
        app: correct-target-app
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: lab-broken-service
  namespace: default
  labels:
    lab.devsecops.io/scenario: broken-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 80
  # Deliberate selector mismatch: pod label is 'correct-target-app', but selector looks for 'wrong-selector-target'
  # This results in <none> endpoints and 502/connection refused
  selector:
    app: wrong-selector-target
