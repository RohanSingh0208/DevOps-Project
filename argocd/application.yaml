apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-resource-hub
  namespace: argocd
  labels:
    app.kubernetes.io/name: campus-resource-hub
    app.kubernetes.io/managed-by: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: "https://github.com/RohanSingh0208/DevOps-Project.git"
    targetRevision: main
    path: helm/campus-resource-hub
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: campus-resource-hub
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
