services:
  # ── PostgreSQL Database Service ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: campus-hub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-campus_resource_hub}
      POSTGRES_USER: ${POSTGRES_USER:-campus_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-campus_secure_password_2026}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-campus_admin} -d ${POSTGRES_DB:-campus_resource_hub}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    networks:
      - campus-network

  # ── Dedicated Database Migration Service (Runs once before backend) ─────────
  migration:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-hub-migration
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secure_password_2026}@postgres:5432/${POSTGRES_DB:-campus_resource_hub}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secure_password_2026}@postgres:5432/${POSTGRES_DB:-campus_resource_hub}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - campus-network

  # ── FastAPI Backend Service ────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: campus-hub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secure_password_2026}@postgres:5432/${POSTGRES_DB:-campus_resource_hub}
      DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-campus_admin}:${POSTGRES_PASSWORD:-campus_secure_password_2026}@postgres:5432/${POSTGRES_DB:-campus_resource_hub}
      ENVIRONMENT: production
      LOG_LEVEL: INFO
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://localhost:8080,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - campus-network

  # ── React + Nginx Frontend Service ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: campus-hub-frontend
    restart: unless-stopped
    ports:
      - "3000:8080"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - campus-network

volumes:
  postgres_data:
    name: campus-resource-hub-postgres-data
    driver: local

networks:
  campus-network:
    name: campus-resource-hub-network
    driver: bridge
